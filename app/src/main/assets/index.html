function drawCanImg(cx,cy,w,hh,rot){g.save();g.imageSmoothingEnabled=true;g.translate(cx,cy);g.rotate(rot);if(canImg.complete&&canImg.naturalWidth)g.drawImage(canImg,-w/2,-hh/2,w,hh);else R(-w/2,-hh/2,w,hh,'#c0182d');g.restore()}
function hitMon(m,n){m.hp-=n;m.flash=18;score+=m.big?500:100;shake=m.big?8:3;snd(m.big?120:220,50,.18,.2,'square');if(m.kind&&m.hp>0){const f2=m.hp/m.max,np=m.kind>=2?(f2>.7?0:f2>.35?1:2):Math.min(m.np-1,Math.floor((1-m.hp/m.max)*m.np));if(np>m.ph){m.ph=np;m.flash=40;shake=22;m.cd=40;m.act='';m.plan=[];m.ghost=0;m.rec=0;m.vx*=1.35;snd(90,25,.9,.3,'sawtooth');bn={t:170,a:NM[m.kind]+' EVOLVES!',b:UPG[m.kind][np]}}}if(m.hp<=0&&m.big){mons.forEach(q=>{if(!q.big)q.hp=0});if(m.fin){girlFree=true;activateCP(2)}else{pendCP=m.ri;openUp()}};if(m.hp<=0&&!m.big&&m.drop){m.drop=0;canPk.push({x:m.x+m.w/2,y:GY,got:0})}}

function boom(x,y,tgt){
 shake=Math.max(shake,9);snd(110,28,.4,.32,'sawtooth');snd(520,90,.22,.2,'square');ex.push({x,y,t:22});
 for(let i=0;i<12;i++){const a=-Math.PI*(.08+.84*Math.random()),v=2+Math.random()*3.8;pt.push({k:'l',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-1,g:.24,l:34+(Math.random()*26|0),s:i%4?2:3,c:['#e8aa28','#f6d77a','#fff8e1'][i%3]})}
 mons.forEach(m=>{if(m.hp<=0||m.sleep||m.ghost||m.grow<1)return;const nx=Math.max(m.x,Math.min(x,m.x+m.w)),ny=Math.max(m.y,Math.min(y,m.y+m.h));if(Math.hypot(nx-x,ny-y)>72&&m!==tgt)return;
  const big=m.big||m.kind,d=m===tgt;if(big&&m.flash>0)return;hitMon(m,big?(d?2:1):(d?3:2));if(m.hp>0){m.stun=big?18:90;if(!big)m.x+=Math.sign(m.x+m.w/2-x)*10}})}
function activateCP(i){cpDone[i]=1;cp={S:{...S},maxL,score,cans,hearts:hearts.map(c=>c.got),canPk:canPk.slice(0,7).map(c=>c.got),dead:mons.slice(0,11).map(m=>m.hp<=0),done:cpDone.slice(),x:CPX[i]-13,i};cpAnim={i,t:140};bn={t:180,a:'CHECKPOINT UNLOCKED',b:'Progress saved'};arp([523,659,784,1047]);try{localStorage.setItem('3lb',JSON.stringify(cp))}catch(e){}}
function loadCP(){reset(true);Object.assign(S,cp.S);maxL=cp.maxL;lives=maxL;score=cp.score;cans=cp.cans;hearts.forEach((c,i)=>c.got=cp.hearts[i]);canPk.forEach((c,i)=>{if(i<cp.canPk.length)c.got=cp.canPk[i]});cpDone=cp.done.slice();
 mons.slice(0,11).forEach((m,i)=>{if(cp.dead[i]){m.hp=0;m.sleep=1}});rooms.forEach((r,i)=>{if(cp.dead[8+i])r.state=2});girlFree=!!cp.dead[10];
 hero.x=cp.x;hero.y=GY-48;hero.inv=70;cam=Math.max(0,Math.min(LEVEL-W,hero.x-W/2));if(S.dash)document.getElementById('dashBtn').style.display='';bn={t:120,a:'CHECKPOINT',b:'Restarted from last boss'}}
function drawCPs(){drawArenaFloor();
 canPk.forEach(c=>{if(c.got)return;const b=Math.sin(t*.08+c.x)*3;g.save();g.globalCompositeOperation='lighter';const gr=g.createRadialGradient(c.x,c.y-16+b,2,c.x,c.y-16+b,26);gr.addColorStop(0,'rgba(255,220,120,.45)');gr.addColorStop(1,'rgba(255,200,60,0)');g.fillStyle=gr;g.fillRect(c.x-26,c.y-44+b,52,56);g.restore();drawCanImg(c.x,c.y-16+b,13,30,Math.sin(t*.05+c.x)*.12)});
 cpDone.forEach((d,i)=>{if(!d)return;const x=CPX[i],a=cpAnim&&cpAnim.i===i?cpAnim.t:0;g.save();g.globalCompositeOperation='lighter';const gr=g.createRadialGradient(x,GY-30,2,x,GY-30,44);gr.addColorStop(0,'rgba(255,230,120,.55)');gr.addColorStop(1,'rgba(255,200,60,0)');g.fillStyle=gr;g.fillRect(x-44,GY-74,88,88);g.restore();
  R(x-2,GY-52,4,52,'#c9ccd8');g.fillStyle='#ffd166';g.beginPath();g.moveTo(x+2,GY-52);g.lineTo(x+26,GY-44+Math.sin(t*.1)*2);g.lineTo(x+2,GY-34);g.fill();R(x-6,GY-4,12,4,'#8a8fb0');
  if(a>0){g.save();g.globalCompositeOperation='lighter';g.fillStyle='rgba(255,230,140,'+a/140*.5+')';g.fillRect(x-10,0,20,GY);g.strokeStyle='rgba(255,240,170,'+a/140+')';g.lineWidth=3;g.beginPath();g.arc(x,GY-20,(140-a)*.9,0,7);g.stroke();g.restore()}})}
function drawCanShot(s){drawCanImg(s.x,s.y,12,28,s.r)}
function drawBoom(){
 g.save();g.imageSmoothingEnabled=false;
 ex.forEach(e=>{const f=Math.max(0,Math.min(7,Math.floor((22-e.t)/22*8)));if(splashImg.complete&&splashImg.naturalWidth)g.drawImage(splashImg,f*64,0,64,64,Math.round(e.x-64),Math.round(e.y-84),128,128)});

  if(m.hp<=0||m.sleep||m.sum)return;if(m.cl){drawClone(m);return}if(m.kind){m.kind===1?drawPhotoBoss(m):m.kind===2?drawPhotoBoss2(m):m.kind===3?drawPhotoBoss3(m):drawBoss(m);return}if(m.hp<m.max){R(m.x,m.y-9,m.w,5,'#000');R(m.x+1,m.y-8,(m.w-2)*m.hp/m.max,3,'#ff5d8f')}
  const x=m.x,y=m.y,w=m.w,h=m.h,c=m.flash>0&&m.flash%2?'#fff':(m.big?(m.fin?'#7a1fa2':m.x0<1500?'#d9822b':'#2b86d9'):(m.col||'#3fbf6a'));
  const sq=Math.sin(t*.2+x)*2;
  g.fillStyle=c;g.beginPath();g.ellipse(x+w/2,y+h/2+sq/2,w/2,h/2-sq/2+0,0,0,7);g.fill();
  R(x+w*.1,y+h-6,w*.2,6,c);R(x+w*.7,y+h-6,w*.2,6,c);
  const s=m.big?1.9:1;
  g.fillStyle=m.big?'#ffd166':'#c23a3a';
  g.beginPath();g.moveTo(x+w*.12,y+6);g.lineTo(x+w*.2,y-10*s);g.lineTo(x+w*.34,y+4);g.fill();
  g.beginPath();g.moveTo(x+w*.88,y+6);g.lineTo(x+w*.8,y-10*s);g.lineTo(x+w*.66,y+4);g.fill();
  R(x+w*.2,y+h*.3,w*.22,w*.2,'#fff');R(x+w*.58,y+h*.3,w*.22,w*.2,'#fff');
  const lx=m.vx>0?3:0;R(x+w*.28+lx,y+h*.36,w*.1,w*.1,'#111');R(x+w*.66+lx,y+h*.36,w*.1,w*.1,'#111');
  R(x+w*.25,y+h*.7,w*.5,4,'#111');for(let i=0;i<4;i++)R(x+w*.28+i*w*.12,y+h*.7,3,5,'#fff');
  if(m.big){for(let i=0;i<m.hp;i++)R(x+i*13,y-30,10,10,'#ff5d8f')}
}
function drawGirl(){
  const x=4080,y=GY-50;
  R(x+6,y+24,20,26,'#ff5d8f');R(x+10,y+46,5,4,'#f2c9a0');R(x+18,y+46,5,4,'#f2c9a0');
  R(x+7,y+6,18,18,'#f2c9a0');R(x+3,y+2,26,10,'#c0392b');R(x+2,y+8,6,22,'#c0392b');R(x+24,y+8,6,22,'#c0392b');
  R(x+11,y+14,3,3,'#222');R(x+19,y+14,3,3,'#222');R(x+13,y+20,7,2,'#c23a3a');
  R(x+12,y-6,10,6,'#ffd166');
  if(girlFree){const b=Math.sin(t*.2)*3;g.fillStyle='#ff5d8f';g.font='16px "Press Start 2P",monospace';g.fillText('♥',x+8,y-14+b)}
  else{for(let i=0;i<7;i++)R(x-4+i*6,y-8,3,64,'#9aa3b8');R(x-6,y-10,44,5,'#9aa3b8');R(x-6,GY-6,44,6,'#9aa3b8');
    g.fillStyle='#fff4d6';g.font='8px "Press Start 2P",monospace';g.fillText('HELP!',x-6,y-20+Math.sin(t*.2)*3)}
}
function draw(){
  g.save();
  if(shake>0)g.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  bg();
  g.save();g.translate(-Math.round(cam),0);drawRooms();
  plats.forEach(p=>{
    if(p[1]===GY){R(p[0],p[1],p[2],p[3],'#3b2a63');R(p[0],p[1],p[2],8,'#6bcb77');for(let i=0;i<p[2];i+=24)R(p[0]+i,p[1]+8,3,4,'#6bcb77')}
    else{R(p[0],p[1],p[2],p[3],'#8a5a3b');R(p[0],p[1],p[2],4,'#6bcb77')}
  });
  hearts.forEach(c=>{if(!c.got){const b=Math.sin(t*.1+c.x)*3;g.fillStyle='#ff5d8f';g.font='18px "Press Start 2P",monospace';g.fillText('♥',c.x-9,c.y+b)}});
  drawGirl();drawCPs();mons.forEach(drawMon);drawSums();drawHero();drawShots();drawBoom();
  g.restore();g.restore();
  // HUD
  g.font='12px "Press Start 2P",monospace';g.fillStyle='#ff5d8f';
  g.drawImage(spr,3,0,18,23,8,3,28,36);for(let i=0;i<lives;i++)g.fillText('♥',54+i*22,30);R(54,38,70,5,'#00000099');R(54,38,70*(1-Math.max(0,hero.acd|0)/48),5,hero.acd>0?'#8a8fb0':'#ffd166');g.fillStyle='#8fe3a0';g.font='9px "Press Start 2P",monospace';g.fillText('+'+S.pot,132,45);drawCanImg(180,46,11,24,0);g.fillStyle=cans?'#fff4d6':'#8a8fb0';g.fillText('x'+cans,190,52);g.font='12px "Press Start 2P",monospace';
  g.fillStyle='#ffd166';g.textAlign='right';g.fillText('SCORE '+score,W-14,28);g.textAlign='left';
  if(!girlFree&&hero.x>2600&&rooms[2].state!==1){g.fillStyle='#fff4d6';g.font='9px "Press Start 2P",monospace';g.fillText('Defeat the Dungeon Lord!',W/2-110,52)}
  if(girlFree){g.fillStyle='#fff4d6';g.font='9px "Press Start 2P",monospace';g.fillText('The cage is open! Run to her!',W/2-125,52)}
  if(rooms[2]&&rooms[2].state===1&&rooms[2].boss.hp>0)drawBossBar(rooms[2].boss);if(bn&&bn.t>0){bn.t--;g.textAlign='center';g.fillStyle='#ff4d4d';g.font='14px "Press Start 2P",monospace';g.fillText(bn.a,W/2,92);g.fillStyle='#fff4d6';g.font='9px "Press Start 2P",monospace';g.fillText(bn.b,W/2,114);g.textAlign='left'}
}
function card(title,sub,col){
  g.fillStyle='#120d2bdd';g.fillRect(0,0,W,H);g.textAlign='center';
  g.fillStyle=col;g.font='28px "Press Start 2P",monospace';g.fillText(title,W/2,150);
  g.fillStyle='#fff4d6';g.font='11px "Press Start 2P",monospace';
  sub.forEach((s,i)=>g.fillText(s,W/2,200+i*26));g.textAlign='left';
}
let last=0,acc=0;
function loop(ts=0){
  acc+=Math.min(50,ts-last);last=ts;
  while(acc>=16.667){acc-=16.667;if(state==='play')update();else if(state==='up')upT++}
  if(state==='title'){t++;reset(true);hero.x=300;bg();draw();card('3LI BIRA',['The monsters took your girlfriend.','Cross the dark forest. Beat the Dungeon Lord.','Move: arrows/AD  Jump: Space  Sword: X  Can: G',cp?'Any key / tap left: CONTINUE   N / tap right: NEW':'Press any key or tap to start'],'#ff5d8f')}
  else{draw();
    if(state==='up')drawUp();
    if(state==='over')card('GAME OVER',['The monsters won this round...','',(cp?'Any key: restart at CHECKPOINT':'Press any key or tap to try again')],'#ff5d8f');
    if(state==='win')card('YOU SAVED HER!',['Score: '+score,'Together at last. ♥','','Press any key or tap to play again'],'#ffd166')}
  requestAnimationFrame(loop);
}
reset(true);loop();
</script>
